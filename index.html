<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TK Tools</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; color: #1c2430; margin: 0; padding: 32px 16px; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    a.tool { display: block; background: #fff; border-radius: 14px; padding: 18px 20px; text-decoration: none; color: inherit; box-shadow: 0 1px 3px rgba(16,24,40,.1); margin-bottom: 12px; }
    a.tool b { color: #1565c0; font-size: 1.15rem; }
    a.tool span { display: block; color: #667085; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>TK Tools</h1>
    <a class="tool" href="qr-patrol/"><b>QR Patrol</b><span>Offline QR patrol log for housekeeping rounds (PWA). Open once on Wi-Fi, add to home screen, then use offline.</span></a>
  </main>
</body>
</html>
