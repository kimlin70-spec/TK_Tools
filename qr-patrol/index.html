<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Patrol</title>
  <meta name="description" content="Simple offline QR patrol log for housekeeping rounds.">
  <meta name="theme-color" content="#1565c0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QR Patrol">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home">QR Patrol</a>
      <span id="topbar-right" class="topbar-right"></span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="bottomnav" aria-label="Main">
    <a href="#/home" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#/scan" data-nav="scan" class="nav-scan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h6v2H5v4H3zm12 0h6v6h-2V5h-4zM3 15h2v4h4v2H3zm16 0h2v6h-6v-2h4zM7 7h4v4H7zm6 0h4v4h-4zM7 13h4v4H7zm6 0h2v2h-2zm2 2h2v2h-2zm-2 2h2v2h-2z"/></svg>
      <span>Scan</span>
    </a>
    <a href="#/history" data-nav="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 1-8.49 12H6.6A7 7 0 1 0 13 5a6.96 6.96 0 0 0-4.95 2.05L10 9H4V3l2.6 2.6A8.97 8.97 0 0 1 13 3zm-1 5h1.5v4.25l3.5 2.08-.75 1.23L12 13V8z"/></svg>
      <span>History</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast" role="status"></div>

  <script src="lib/qrcode.js"></script>
  <script src="lib/jsQR.js"></script>
  <script src="lib/xlsx.mini.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/export.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
